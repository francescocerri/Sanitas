definitions:
  github_com_francescocerri_sanitas_services_shifts_internal_shift.Booking:
    properties:
      created_at:
        type: string
      date:
        type: string
      decided_at:
        type: string
      decided_by:
        description: |-
          DecidedBy/DecidedAt stay nil while the request is pending; for a
          manager's direct booking (no approval needed) they're already set at
          creation time.
        type: string
      end_time:
        type: string
      id:
        type: string
      start_time:
        type: string
      status:
        $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.BookingStatus'
      template_id:
        type: string
      volunteer_id:
        type: string
    type: object
  github_com_francescocerri_sanitas_services_shifts_internal_shift.BookingStatus:
    enum:
    - pending
    - confirmed
    - rejected
    - cancelled
    type: string
    x-enum-varnames:
    - BookingStatusPending
    - BookingStatusConfirmed
    - BookingStatusRejected
    - BookingStatusCancelled
  github_com_francescocerri_sanitas_services_shifts_internal_shift.Occurrence:
    properties:
      date:
        type: string
      end_time:
        type: string
      label:
        type: string
      start_time:
        type: string
      status:
        $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.OccurrenceStatus'
      template_id:
        type: string
      weekday:
        type: integer
    type: object
  github_com_francescocerri_sanitas_services_shifts_internal_shift.OccurrenceStatus:
    enum:
    - free
    - pending
    - confirmed
    type: string
    x-enum-varnames:
    - OccurrenceStatusFree
    - OccurrenceStatusPending
    - OccurrenceStatusConfirmed
  github_com_francescocerri_sanitas_services_shifts_internal_shift.ShiftTemplate:
    properties:
      active:
        description: |-
          No DB default (`default:true`): for a bool field, GORM omits a Go
          zero value (false) from the INSERT and the DB default would still
          apply — a caller explicitly wanting `false` would be silently
          ignored. The repository sets Active by hand at creation (see
          CreateTemplate), same principle already used for Booking.Status.
        type: boolean
      end_time:
        type: string
      id:
        type: string
      label:
        description: |-
          Cosmetic, shown in the UI (e.g. "Turno 3") — empty string allowed,
          doesn't drive any logic.
        type: string
      start_time:
        description: |-
          "HH:MM". EndTime < StartTime means an overnight shift spanning two
          days (e.g. 20:00-08:00) — these are times of day, not timestamps: no
          time.Time here, sidesteps timezone/fake-date concerns for a value
          that's only ever "what time of day".
        type: string
      weekday:
        description: |-
          Weekday follows Go's time.Weekday (0=Sunday...6=Saturday): reuses a
          stdlib conversion for generating occurrences instead of inventing a
          numbering scheme to remember.
        type: integer
    type: object
  internal_httpapi.createBookingRequest:
    properties:
      date:
        type: string
      template_id:
        type: string
    type: object
  internal_httpapi.createTemplateRequest:
    properties:
      end_time:
        type: string
      label:
        type: string
      start_time:
        type: string
      weekday:
        type: integer
    type: object
  internal_httpapi.pendingBookingsCountResponse:
    properties:
      pending_count:
        type: integer
    type: object
  internal_httpapi.updateTemplateRequest:
    properties:
      active:
        type: boolean
      end_time:
        type: string
      label:
        type: string
      start_time:
        type: string
      weekday:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Shift management. Recurring shift templates (day of week + time range) and
    volunteer bookings against them — see docs/adr/0025-modello-dati-turni.md in
    the repository. The resource endpoints themselves are still being rebuilt on
    top of this model (see docs/backlog.md); only /healthz and /docs/ exist today.
  title: Sanitas — Shifts API
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          description: Service healthy
        "503":
          description: Database unreachable
      summary: Liveness check
      tags:
      - system
  /v1/shift-bookings:
    post:
      consumes:
      - application/json
      parameters:
      - description: Template id and date (YYYY-MM-DD)
        in: body
        name: booking
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.createBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.Booking'
        "400":
          description: Invalid payload, past date, inactive template, or weekday mismatch
        "401":
          description: Authentication required
        "403":
          description: 'Missing required permission: shifts:request'
        "404":
          description: Template not found
        "409":
          description: Slot already confirmed, or the caller already has a pending/confirmed
            booking for it
      security:
      - BearerAuth: []
      summary: Request a booking for an open slot (requires the shifts:request permission)
      tags:
      - shift-bookings
  /v1/shift-bookings/pending-count:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.pendingBookingsCountResponse'
        "401":
          description: Authentication required
        "403":
          description: 'Missing required permission: shifts:write'
      security:
      - BearerAuth: []
      summary: Count pending booking requests (requires the shifts:write permission)
      tags:
      - shift-bookings
  /v1/shift-occurrences:
    get:
      parameters:
      - description: Start date, inclusive (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End date, inclusive (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.Occurrence'
            type: array
        "400":
          description: Missing or invalid from/to, or range too wide
        "401":
          description: Authentication required
        "403":
          description: 'Missing required permission: shifts:read'
      security:
      - BearerAuth: []
      summary: List shift occurrences with coverage status in a date range (requires
        the shifts:read permission)
      tags:
      - shift-occurrences
  /v1/shift-templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.ShiftTemplate'
            type: array
        "401":
          description: Authentication required
        "403":
          description: 'Missing required permission: shifts:read'
      security:
      - BearerAuth: []
      summary: List shift templates (requires the shifts:read permission)
      tags:
      - shift-templates
    post:
      consumes:
      - application/json
      parameters:
      - description: Weekday (0=Sunday..6=Saturday), start/end time (HH:MM), label
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.createTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.ShiftTemplate'
        "400":
          description: Invalid payload
        "401":
          description: Authentication required
        "403":
          description: 'Missing required permission: shifts:configure'
      security:
      - BearerAuth: []
      summary: Create a shift template (requires the shifts:configure permission)
      tags:
      - shift-templates
  /v1/shift-templates/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Template id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Full new set of fields
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.updateTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_francescocerri_sanitas_services_shifts_internal_shift.ShiftTemplate'
        "400":
          description: Invalid payload
        "401":
          description: Authentication required
        "403":
          description: 'Missing required permission: shifts:configure'
        "404":
          description: Template not found
      security:
      - BearerAuth: []
      summary: Replace a shift template (requires the shifts:configure permission)
      tags:
      - shift-templates
securityDefinitions:
  BearerAuth:
    description: |-
      shifts issues no tokens itself — type "Bearer" followed by a space and
      the access token obtained from registry's POST /v1/login (e.g. "Bearer eyJhbGci...").
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
