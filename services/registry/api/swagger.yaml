definitions:
  httpapi.activateUserRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  httpapi.authTokens:
    properties:
      refresh_token:
        type: string
      token:
        type: string
    type: object
  httpapi.changePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  httpapi.confirmPasswordResetRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  httpapi.createUserRequest:
    properties:
      email:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  httpapi.createUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_sent:
        description: |-
          EmailSent is best-effort: the user is already created by the time we
          know this, so a failed send never turns the request into an error —
          see docs/adr/0023-invio-email-invito-smtp.md.
        type: boolean
      id:
        type: string
      invite_url:
        description: |-
          InviteURL is always returned regardless of EmailSent, as a fallback
          the admin can still copy/forward by hand — e.g. if SMTP isn't
          configured for this deployment, or the send itself failed.
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  httpapi.loginRequest:
    properties:
      identifier:
        type: string
      password:
        type: string
    type: object
  httpapi.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  httpapi.requestPasswordResetRequest:
    properties:
      identifier:
        type: string
    type: object
  httpapi.updateUserRolesRequest:
    properties:
      roles:
        items:
          type: string
        type: array
    type: object
  user.Role:
    properties:
      display_name:
        type: string
      id:
        type: string
      slug:
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Users, roles, authentication. Admin-created users, activation via token,
    login, password change, forgot-password reset. Invite and reset emails are
    sent via SMTP when configured (see docs/adr/0023, docs/adr/0024), otherwise
    the invite link is returned in the API response for the admin to forward by hand.
  title: Sanitas — Registry API
  version: 0.1.0
paths:
  /.well-known/jwks.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Public key to verify JWTs (JWKS format)
      tags:
      - system
  /healthz:
    get:
      responses:
        "200":
          description: Service healthy
        "503":
          description: Database unreachable
      summary: Liveness check
      tags:
      - system
  /v1/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email or username + password
        in: body
        name: credenziali
        required: true
        schema:
          $ref: '#/definitions/httpapi.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.authTokens'
        "400":
          description: Invalid payload
        "401":
          description: Invalid credentials
      summary: Login
      tags:
      - auth
  /v1/logout:
    post:
      consumes:
      - application/json
      description: |-
        Invalidates the given refresh token. An access token already issued stays
        valid until its own expiry (24h) — no revocation mechanism for those yet,
        see docs/adr/0013.
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/httpapi.refreshRequest'
      responses:
        "204":
          description: Logged out
        "400":
          description: Invalid payload
        "401":
          description: Invalid, expired, or already used token
      summary: Logout
      tags:
      - auth
  /v1/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Authentication required
      security:
      - BearerAuth: []
      summary: Get the authenticated user's profile
      tags:
      - auth
  /v1/password/change:
    post:
      consumes:
      - application/json
      parameters:
      - description: Old and new password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/httpapi.changePasswordRequest'
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid payload
        "401":
          description: Old password incorrect
      security:
      - BearerAuth: []
      summary: Change the authenticated user's password
      tags:
      - auth
  /v1/password/reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset token and new password
        in: body
        name: conferma
        required: true
        schema:
          $ref: '#/definitions/httpapi.confirmPasswordResetRequest'
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid payload
        "401":
          description: Invalid, expired, or already used token
      summary: Confirm a password reset via the emailed token, setting a new password
      tags:
      - auth
  /v1/password/reset/request:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email or username
        in: body
        name: richiesta
        required: true
        schema:
          $ref: '#/definitions/httpapi.requestPasswordResetRequest'
      responses:
        "204":
          description: Always returned, whether or not the identifier matches an account
        "400":
          description: Invalid payload
      summary: Request a password reset email
      tags:
      - auth
  /v1/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Consumes the given refresh token (single use — see docs/adr/0016) and
        returns a new access token plus a new refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/httpapi.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.authTokens'
        "400":
          description: Invalid payload
        "401":
          description: Invalid, expired, or already used token
      summary: Refresh the access token
      tags:
      - auth
  /v1/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.Role'
            type: array
        "401":
          description: Authentication required
        "500":
          description: Internal error
      security:
      - BearerAuth: []
      summary: List available roles (any authenticated user)
      tags:
      - roles
  /v1/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
        "401":
          description: Authentication required
      security:
      - BearerAuth: []
      summary: List all users (any authenticated user)
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: Email, username, roles (slug)
        in: body
        name: utente
        required: true
        schema:
          $ref: '#/definitions/httpapi.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.createUserResponse'
        "400":
          description: Invalid payload or unknown role
        "403":
          description: 'Missing required permission: users:manage'
        "409":
          description: Email or username already in use
      security:
      - BearerAuth: []
      summary: Create a new user (requires the users:manage permission)
      tags:
      - users
  /v1/users/{id}/roles:
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Full new set of role slugs
        in: body
        name: ruoli
        required: true
        schema:
          $ref: '#/definitions/httpapi.updateUserRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Invalid payload or unknown role
        "403":
          description: 'Missing required permission: users:manage'
        "404":
          description: User not found
      security:
      - BearerAuth: []
      summary: Replace a user's roles (requires the users:manage permission)
      tags:
      - users
  /v1/users/activate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invite token and new password
        in: body
        name: attivazione
        required: true
        schema:
          $ref: '#/definitions/httpapi.activateUserRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Account activated
        "400":
          description: Invalid payload
        "401":
          description: Invalid, expired, or already used token
      summary: Activate an account via the invite token, setting the password
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token from POST
      /v1/login (e.g. "Bearer eyJhbGci...").
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
