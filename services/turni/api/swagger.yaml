basePath: /v1
definitions:
  github_com_francescocerri_sanitas_services_turni_internal_turno.Turno:
    properties:
      data:
        type: string
      id:
        type: string
      ora_fine:
        type: string
      ora_inizio:
        type: string
      stato:
        type: string
      volontario_id:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Turno (shift) management. The data model is intentionally skeletal (see docs/adr/0005
    in the repository): it validates the end-to-end pipeline, not the final domain design.
  title: Sanitas — Turni API
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          description: Service healthy
        "503":
          description: Database unreachable
      summary: Liveness check
      tags:
      - system
  /turni:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_francescocerri_sanitas_services_turni_internal_turno.Turno'
            type: array
      summary: List turni
      tags:
      - turni
    post:
      consumes:
      - application/json
      parameters:
      - description: New turno (id and stato in the input are ignored)
        in: body
        name: turno
        required: true
        schema:
          $ref: '#/definitions/github_com_francescocerri_sanitas_services_turni_internal_turno.Turno'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_francescocerri_sanitas_services_turni_internal_turno.Turno'
        "400":
          description: Invalid payload
      summary: Create a new turno
      tags:
      - turni
  /turni/{id}:
    get:
      parameters:
      - description: Turno id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_francescocerri_sanitas_services_turni_internal_turno.Turno'
        "404":
          description: Turno not found
      summary: Get a turno by id
      tags:
      - turni
swagger: "2.0"
