services:
  # Un solo Postgres condiviso da shifts e registry, con uno schema
  # Postgres per servizio (namespace nativo, non un database separato) —
  # vedi ADR-0014. Nessuno script di init: registry crea il proprio schema
  # da codice all'avvio (GORM AutoMigrate), shifts fa lo stesso con il proprio
  # (con retry, perché la sua FK verso registry.users richiede che lo
  # schema di registry esista già — vedi docs/adr/0019).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?la password del database è obbligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-sanitas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo su localhost (non su tutta la LAN): comodo per ispezionare il DB
      # con un client come DBeaver, in produzione riduce la superficie esposta
      # sul Raspberry Pi rispetto a un bind su tutte le interfacce.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanitas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  shifts:
    build:
      context: ../services/shifts
    restart: unless-stopped
    environment:
      PORT: 8080
      # search_path punta al proprio schema: le query esistenti (FROM shifts,
      # senza prefisso) continuano a funzionare senza riscrivere nulla.
      DATABASE_URL: postgres://${POSTGRES_USER:-sanitas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sanitas}?sslmode=disable&search_path=shifts
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      # shifts non emette token, verifica solo quelli emessi da registry —
      # rete interna del compose, sempre porta 8080 (vedi docs/adr/0017).
      AUTH_JWKS_URL: http://registry:8080/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      # Nessun healthcheck su registry oggi: shifts gestisce un primo
      # fallimento nel recupero della JWKS con retry al proprio avvio.
      registry:
        condition: service_started
    ports:
      # Porta lato host configurabile: la 8080 è comunemente occupata da
      # altri servizi in sviluppo. Il servizio dentro il container resta
      # sempre su 8080 (PORT sopra) — cambia solo il mapping esterno.
      - "${SHIFTS_HOST_PORT:-8080}:8080"

  registry:
    build:
      context: ../services/registry
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-sanitas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sanitas}?sslmode=disable&search_path=registry
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key.pem
      ROLES_SEED_PATH: /config/registry/roles.json
      INVITE_URL_BASE: ${INVITE_URL_BASE:-http://localhost:5173/attiva}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/#/reset-password}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_CONFIG_PATH: /config/registry/email.json
    volumes:
      # Chiave privata JWT e ruoli del comitato: mai committati, mai
      # copiati nell'immagine — montati da fuori (vedi services/registry/README.md
      # per generare la chiave; COMMITTEE_CONFIG_DIR punta a config/<slug>/).
      - ${JWT_PRIVATE_KEY_HOST_PATH:-../services/registry/jwt_private_key.pem}:/run/secrets/jwt_private_key.pem:ro
      - ${COMMITTEE_CONFIG_DIR:-../config/pavullo}:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${REGISTRY_HOST_PORT:-8090}:8080"

  # Espone i servizi via Cloudflare Tunnel: nessuna porta aperta sul router,
  # TLS gestito da Cloudflare. Attivo solo in produzione (Raspberry Pi):
  # docker compose --profile prod up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?token del tunnel Cloudflare obbligatorio}
    profiles:
      - prod
    depends_on:
      - shifts
      - registry

volumes:
  postgres_data:
