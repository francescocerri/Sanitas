name: sanitas_app
description: "Sanitas — app di gestione per associazioni di volontariato (login, anagrafica)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.0.0
  easy_localization: ^3.0.8
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # assets/translations/*.json = stringhe i18n (easy_localization).
  # assets/committee/theme.json = tema colori del comitato, sincronizzato da
  # config/<slug>/app/theme.json tramite scripts/sync_committee_config.sh
  # PRIMA di ogni `flutter run`/`flutter build` — non è mai la sorgente vera,
  # per questo non è committato (vedi .gitignore); solo il file .example lo è.
  assets:
    - assets/translations/
    - assets/committee/
