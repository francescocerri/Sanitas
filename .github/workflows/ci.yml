name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-shifts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shifts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/shifts/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verifica che api/ (Swagger) sia allineata alle annotazioni nel codice
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/server/main.go -d . -o api --parseInternal --parseDependency
          git diff --exit-code -- api/

  go-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/registry/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verifica che api/ (Swagger) sia allineata alle annotazioni nel codice
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/server/main.go -d . -o api --parseInternal --parseDependency
          git diff --exit-code -- api/

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Sincronizza il tema del comitato (config/pavullo/app/theme.json)
        run: ./scripts/sync_committee_config.sh
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define-from-file=env.example.json
