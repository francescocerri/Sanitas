name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-shifts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shifts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/shifts/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verifica che api/ (Swagger) sia allineata alle annotazioni nel codice
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/server/main.go -d . -o api --parseInternal --parseDependency
          git diff --exit-code -- api/

  go-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/registry/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verifica che api/ (Swagger) sia allineata alle annotazioni nel codice
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/server/main.go -d . -o api --parseInternal --parseDependency
          git diff --exit-code -- api/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm audit --audit-level=high
