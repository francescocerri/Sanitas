name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via docker compose
        working-directory: deploy
        run: docker compose --profile prod up -d --build
